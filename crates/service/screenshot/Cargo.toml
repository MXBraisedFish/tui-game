[package]
name = "tg-service-screenshot"
version.workspace = true
edition.workspace = true

[dependencies]
chrono = { workspace = true }
crossbeam-channel = "0.5"
fontdb = "0.23"
fontdue = "0.9"
ttf-parser = "0.25.1"
harfrust = "0.13.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tg-core-atomic-fs = { path = "../../core/atomic_fs" }
tg-core-log = { path = "../../core/log" }
tg-core-style = { path = "../../core/style" }
tg-core-version = { path = "../../core/version" }
tg-service-async = { path = "../async" }
tg-service-log = { path = "../log" }
tg-service-storage = { path = "../storage" }
unicode-segmentation = { workspace = true }
unicode-bidi = "0.3.18"
unicode-script = "0.5.7"
unicode-width = { workspace = true }

[dev-dependencies]
tg-service-async = { path = "../async", features = ["test-support"] }
tg-service-storage = { path = "../storage", features = ["test-support"] }
