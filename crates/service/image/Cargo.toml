[package]
name = "tg-service-image"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std"] }
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { workspace = true }
serde_json = { workspace = true }
tg-core-atomic-fs = { path = "../../core/atomic_fs" }
tg-core-version = { path = "../../core/version" }
tg-service-async = { path = "../async" }

[dev-dependencies]
tg-service-async = { path = "../async", features = ["test-support"] }
