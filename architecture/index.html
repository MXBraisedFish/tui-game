<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TUI GAME · 当前架构</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">tg<span>_</span></span><div><h1>TUI GAME</h1><span class="brand-subtitle">ARCHITECTURE EXPLORER</span></div></div>
    <nav class="tabs" aria-label="架构视图">
      <button class="tab active" data-view="graph" aria-pressed="true">依赖总览</button>
      <button class="tab" data-view="flow" aria-pressed="false">生命周期</button>
      <button class="tab" data-view="tree" aria-pressed="false">模块树</button>
      <button class="tab" data-view="findings" aria-pressed="false">架构检查</button>
    </nav>
    <span class="current-label"><i aria-hidden="true"></i>当前架构</span>
  </header>
  <section class="workspace-head" aria-label="视图概况">
    <div class="view-intro"><h2 id="view-title">依赖总览</h2><p id="view-description">从主程序到服务与核，探索模块之间的连接。</p></div>
    <div class="stats" id="stats"></div>
    <button class="btn panel-toggle" id="panel-toggle" aria-controls="inspector" aria-expanded="true">收起详情</button>
  </section>
  <main id="workspace">
    <section class="view" id="view-flow" aria-label="生命周期">
      <div class="canvas-wrap">
        <div class="toolbar">
          <button class="btn" data-action="fit">适应窗口</button>
          <button class="btn" data-action="zoom-in">放大</button>
          <button class="btn" data-action="zoom-out">缩小</button>
        </div>
        <svg id="flow-svg" aria-label="启动、运行与退出流程"></svg>
        <div class="legend" id="flow-legend"></div>
      </div>
    </section>
    <section class="view" id="view-tree" aria-label="模块树">
      <div class="canvas-wrap">
        <div class="toolbar">
          <button class="btn" data-action="fit">适应窗口</button>
          <button class="btn" data-action="expand">全部展开</button>
          <button class="btn" data-action="collapse">收起到第 3 层</button>
          <span class="toolbar-hint">圆点展开 · 名称查看详情</span>
        </div>
        <svg id="tree-svg" aria-label="Rust 模块树"></svg>
        <div class="legend" id="tree-legend"></div>
      </div>
    </section>
    <section class="view active" id="view-graph" aria-label="依赖总览">
      <div class="canvas-wrap">
        <div class="toolbar">
          <div class="search-wrap">
            <input type="search" id="graph-search" placeholder="搜索模块…" aria-label="搜索模块" autocomplete="off" aria-controls="graph-search-results">
            <div class="search-results" id="graph-search-results" aria-label="模块搜索结果"></div>
          </div>
          <button class="btn" data-action="overview">总览</button>
          <button class="btn" data-action="fit">适应窗口</button>
          <button class="btn" data-action="bad-only" aria-pressed="false" title="只显示违反分层规则的依赖边">违规依赖</button>
          <span class="toolbar-hint" id="graph-mode-hint"></span>
        </div>
        <svg id="graph-svg" aria-label="模块依赖关系"></svg>
        <div class="legend" id="graph-legend"></div>
      </div>
    </section>
    <section class="view" id="view-findings">
      <div class="findings" id="findings"></div>
    </section>
    <aside class="panel" id="inspector" aria-label="节点详情">
      <div class="panel-heading"><span>INSPECTOR</span><span>节点详情</span></div>
      <div id="panel"></div>
    </aside>
  </main>
  <footer class="statusbar"><span><i aria-hidden="true"></i>Rust + Lua · Cargo workspace</span><span id="generated-at">正在加载架构数据</span><span class="canvas-help">拖动平移 · 滚轮缩放 · 点击查看详情</span></footer>
  <script src="data/current.js"></script>
  <script src="app.js"></script>
</body>
</html>
