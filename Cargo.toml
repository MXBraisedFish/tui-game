[workspace]
members = ["experiments/*", "tools/xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
fontdb = { version = "=0.23.0" }
fontdue = { version = "=0.9.4" }
harfrust = { version = "=0.13.3" }
unicode-segmentation = { version = "=1.13.3" }
unicode-width = { version = "=0.2.2" }
crossterm = { version = "=0.29.0" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Storage_Xps"] }
windows-numerics = "=0.3.1"
toml = "=1.1.4"
