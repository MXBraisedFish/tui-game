[workspace]
members = [".", "crates/core/*", "crates/service/*"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = true, features = ["clock"] }
crossterm = "0.29.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[package]
name = "tui-game"
version.workspace = true
edition.workspace = true
default-run = "tg"

[[bin]]
name = "tg"
path = "src/main.rs"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

[dependencies]
tg-core-arena = { path = "crates/core/arena" }
tg-core-audio = { path = "crates/core/audio" }
tg-core-atomic-fs = { path = "crates/core/atomic_fs" }
tg-core-fault = { path = "crates/core/fault" }
tg-core-geometry = { path = "crates/core/geometry" }
tg-core-input = { path = "crates/core/input" }
tg-core-log = { path = "crates/core/log" }
tg-core-package-id = { path = "crates/core/package_id" }
tg-core-style = { path = "crates/core/style" }
tg-core-unicode = { path = "crates/core/unicode" }
tg-core-version = { path = "crates/core/version" }
tg-service-terminal = { path = "crates/service/terminal" }
tg-service-log = { path = "crates/service/log" }
tg-service-storage = { path = "crates/service/storage" }
tg-service-text-layout = { path = "crates/service/text_layout" }
tg-service-rich-text = { path = "crates/service/rich_text" }
tg-service-code-highlight = { path = "crates/service/code_highlight" }
tg-service-host-object = { path = "crates/service/host_object" }
tg-service-popup = { path = "crates/service/popup" }
tg-service-input-method = { path = "crates/service/input_method" }
tg-service-ffmpeg = { path = "crates/service/ffmpeg" }
tg-service-clipboard = { path = "crates/service/clipboard" }
crossbeam-channel = "0.5"
crossterm = { workspace = true }
mlua = { version = "0.12.0", features = ["lua54", "vendored"] }
regex = "1.13.0"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
anyhow = "1.0.103"
notify = "8"
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
serde_yaml = "0.9"
toml = "1.1.2"
csv = "1.3"
quick-xml = "0.41.0"
chrono = { workspace = true }
rand = "0.10.2"
rand_chacha = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "gzip", "brotli", "deflate", "zstd"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "mp4", "vorbis", "wav"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
mp4 = "0.14.0"
openh264 = "0.9.7"
fontdb = "0.23"
fontdue = "0.9"
base64 = "0.22"
icy_sixel = "0.5"
rdev = "0.5"
palette = "0.7"
zip = { version = "2.3", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.1"
pulldown-cmark = "0.13.4"
sysinfo = "0.38.3"

[dev-dependencies]
tg-service-storage = { path = "crates/service/storage", features = ["test-support"] }
